[platformio]
default_envs = jc8012p4a1c_2635

; Shared application/toolchain settings.  The two concrete environments below
; differ only in the ESP32-P4 silicon target selected by PlatformIO.
[env:base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

extra_scripts =
    pre:scripts/bootstrap_jd9365.py
    pre:scripts/fetch_hosted_c6.py

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32P4_DEV
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_SKIP
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CUSTOM
    -DLV_USE_STDLIB_STRING=LV_STDLIB_CLIB
    -DLV_USE_STDLIB_SPRINTF=LV_STDLIB_CLIB
    -DLV_COLOR_DEPTH=16
    -DLV_DEF_REFR_PERIOD=16
    -DLV_DPI_DEF=130
    -DLV_USE_LOG=1
    -DLV_LOG_LEVEL=LV_LOG_LEVEL_WARN
    -DLV_LOG_PRINTF=1
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_28=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src

lib_deps =
    lvgl/lvgl@9.3.0
    bblanchon/ArduinoJson@7.4.3

lib_ldf_mode = deep+

; Original/batch-2624 panel.  This is the target already proven by the
; Family Calendar project on that hardware.
[env:jc8012p4a1c_2624]
extends = env:base
board = esp32-p4

; SKU 10153001-V3 / batch 2635.  This unit reports ESP32-P4 revision v3.2
; and must be compiled with the production-silicon PlatformIO board target.
[env:jc8012p4a1c_2635]
extends = env:base
board = esp32-p4_r3
